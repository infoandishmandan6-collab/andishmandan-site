@font-face{font-family:'Vazirmatn';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/vazirmatn-arabic-wght-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC;}
@font-face{font-family:'Vazirmatn';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/vazirmatn-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
:root{--bg:#FAF6F0;--panel:#FFFDFA;--blue:#1558B8;--blue-deep:#0F4596;--orange-head:#D2500A;--text:#A84208;--line:rgba(120,80,40,0.22);}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Vazirmatn',Tahoma,Arial,sans-serif;line-height:1.9;font-weight:500}
header{background:var(--blue)}
.bar{max-width:820px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;text-decoration:none;font-size:0.95rem}
.brand img{width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:#fff}
.lang{border:1px solid #fff;background:transparent;color:#fff;border-radius:6px;padding:6px 14px;font:inherit;font-size:0.85rem;cursor:pointer}
.lang:hover{background:rgba(255,255,255,0.15)}
main{max-width:820px;margin:0 auto;padding:36px 24px 56px}
.back{display:inline-block;color:var(--blue-deep);font-weight:700;margin-bottom:18px}
h1{color:var(--orange-head);font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800;line-height:1.4;margin-bottom:6px}
.upd{font-size:0.88rem;margin-bottom:18px}
.intro{margin-bottom:10px;font-size:1.02rem}
h2{color:var(--orange-head);font-size:1.25rem;font-weight:800;margin:28px 0 8px}
p{margin-bottom:10px}
ul{margin:0 0 10px;padding-inline-start:24px}
li{margin-bottom:6px}
a{color:var(--blue-deep)}
.contact{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 22px;margin-top:30px}
.contact h2{margin-top:0}
footer{background:var(--blue);color:#fff;text-align:center;padding:20px 24px;font-size:0.88rem}
footer a{color:#fff;margin:0 8px}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue-deep);outline-offset:2px}
header a:focus-visible,header button:focus-visible,footer a:focus-visible{outline-color:#fff}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;top:-60px;inset-inline-start:8px;background:#fff;color:var(--blue-deep);padding:8px 14px;border:2px solid var(--blue-deep);border-radius:6px;font-weight:700;z-index:9}
.skip:focus{top:8px}
</style>

const T = {"title": {"fa": "سیاست حریم خصوصی", "en": "Privacy Policy", "ps": "د محرمیت تګلاره"}, "name": {"fa": "آموزشگاه زبان‌های خارجی اندیشمندان", "en": "Andishmandan Institute of Foreign Languages", "ps": "د اندیشمندان د بهرنیو ژبو زده‌کړې مرکز"}, "body": {"fa": "<h1>سیاست حریم خصوصی</h1><p class=\"upd\">آخرین به‌روزرسانی: ۲۳ اکتوبر ۲۰۲۶</p><p class=\"intro\">آموزشگاه زبان‌های خارجی اندیشمندان به اطلاعات شما احترام می‌گذارد. این صفحه توضیح می‌دهد کدام اطلاعات را جمع می‌کنیم، چرا، و چه حقی دارید.</p><h2>۱. چه اطلاعاتی جمع می‌کنیم</h2><ul><li>فرم ثبت‌نام: نام کامل، شماره تماس، سن، جنسیت، صنف و سطح مورد نظر، و توضیح اختیاری.</li><li>فرم همکاری: نام، شماره تماس، ایمیل، نوع همکاری، مقطع تحصیلی، سابقه تدریس و مدرک زبان انگلیسی.</li><li>فرم نظرات: نام، دوره، استاد، سطح و متن نظر.</li><li>فرم شکایت: نام، شماره تماس، موضوع و شرح شکایت.</li></ul><p>فقط اطلاعاتی را می‌خواهیم که برای پاسخ به همان فرم لازم است. لطفاً اطلاعات حساس مانند رمز یا مدارک هویتی را در فرم‌ها ننویسید.</p><h2>۲. چرا از آن‌ها استفاده می‌کنیم</h2><ul><li>برای تماس با شما، تعیین سطح و جا دادن در صنف مناسب (ثبت‌نام).</li><li>برای بررسی درخواست همکاری.</li><li>برای بررسی و پاسخ به شکایت.</li><li>برای نمایش نظر شما در سایت، پس از بررسی و فقط با موافقت شما.</li></ul><p>اطلاعات شما را برای تبلیغ یا فروش به دیگران استفاده نمی‌کنیم.</p><h2>۳. رضایت و سن</h2><p>زیر هر فرم یک تیک رضایت هست. با زدن آن اجازه می‌دهید اطلاعات همان فرم ذخیره و استفاده شود.</p><p>اگر زیر ۱۸ سال هستید، فقط با اجازه ولی یا سرپرست خود ثبت‌نام کنید. در فرم ثبت‌نام از شما می‌خواهیم این موضوع را تأیید کنید.</p><h2>۴. چه کسانی اطلاعات را می‌بینند</h2><ul><li>کارکنان و مدیریت آموزشگاه که به پنل مدیریت دسترسی دارند.</li><li>شرکت میزبان سایت که سرور را اداره می‌کند. سرور ممکن است در کشوری غیر از افغانستان (مثلاً آمریکا) باشد.</li></ul><p>اطلاعات شما را به شخص یا شرکت دیگری نمی‌فروشیم، مگر اینکه قانون آن را لازم بداند.</p><h2>۵. ردیابی و سرویس‌های بیرونی</h2><p>سایت ما ابزار آمار، تبلیغات یا ردیابی ندارد و کوکی ردیابی نمی‌گذارد (جزئیات در صفحه سیاست کوکی).</p><p>نقشه گوگل در بخش تماس نمایش داده می‌شود؛ بنابراین مرورگر شما به گوگل وصل می‌شود و گوگل ممکن است کوکی ذخیره کند.</p><p>لینک‌های واتساپ، اینستاگرام و فیسبوک شما را به سایت‌های دیگر می‌برند که سیاست خودشان را دارند.</p><p>سرور برای امنیت، آدرس آی‌پی و زمان بازدید را در لاگ‌های فنی نگه می‌دارد.</p><h2>۶. مدت نگه‌داری</h2><p>اطلاعات را تا زمانی نگه می‌داریم که برای همان هدف لازم است و بعد آن را پاک می‌کنیم. می‌توانید هر زمان درخواست حذف کنید.</p><h2>۷. حق‌های شما</h2><p>می‌توانید بپرسید چه اطلاعاتی از شما داریم، اصلاح یا حذف آن را بخواهید و رضایت خود را پس بگیرید. برای این کار با ما تماس بگیرید؛ تلاش می‌کنیم زود پاسخ بدهیم.</p><h2>۸. امنیت</h2><p>پنل مدیریت با رمز محافظت می‌شود و فقط افراد مجاز وارد آن می‌شوند. هیچ سیستمی صددرصد امن نیست و ما نمی‌توانیم امنیت کامل را تضمین کنیم.</p><h2>۹. تغییرات</h2><p>اگر این سیاست تغییر کند، نسخه جدید با تاریخ تازه در همین صفحه قرار می‌گیرد.</p><div class=\"contact\"><h2>تماس با ما</h2><p>ایمیل: <a href=\"mailto:info.andishmandan6@gmail.com\">info.andishmandan6@gmail.com</a></p><p>تلفن و واتساپ: <a dir=\"ltr\" href=\"tel:+93797821511\" style=\"unicode-bidi:isolate;display:inline-block\">+93797821511</a></p><p>آدرس: امام صاحب، کندز، افغانستان</p></div>", "en": "<h1>Privacy Policy</h1><p class=\"upd\">Last updated: 23 October 2026</p><p class=\"intro\">Andishmandan Institute of Foreign Languages respects your information. This page explains what we collect, why, and what rights you have.</p><h2>1. What we collect</h2><ul><li>Registration form: full name, phone number, age, gender, class and level you want, and an optional note.</li><li>Collaboration form: name, phone, email, type of cooperation, education level, teaching experience and English certificate.</li><li>Review form: name, course, teacher, level and your review.</li><li>Complaint form: name, phone, subject and details of the complaint.</li></ul><p>We only ask for what is needed to answer that form. Please do not type sensitive data such as passwords or ID documents into the forms.</p><h2>2. Why we use it</h2><ul><li>To contact you, check your level and place you in a suitable class (registration).</li><li>To review your cooperation request.</li><li>To review and answer your complaint.</li><li>To show your review on the website, after review and only with your consent.</li></ul><p>We do not use your information for advertising or sell it to others.</p><h2>3. Consent and age</h2><p>Each form has a consent checkbox. By ticking it you allow the information in that form to be stored and used.</p><p>If you are under 18, register only with the permission of a parent or guardian. The registration form asks you to confirm this.</p><h2>4. Who can see it</h2><ul><li>School staff and management who have access to the admin panel.</li><li>The hosting company that runs the server. The server may be in a country other than Afghanistan (for example the United States).</li></ul><p>We do not sell your information to any person or company, unless the law requires us to share it.</p><h2>5. Tracking and outside services</h2><p>Our website has no analytics, advertising or tracking tools and sets no tracking cookies (details on the Cookie Policy page).</p><p>Google Maps is shown in the contact section, so your browser connects to Google, which may store cookies.</p><p>The WhatsApp, Instagram and Facebook links take you to other websites that have their own policies.</p><p>For security, the server keeps technical logs with your IP address and visit time.</p><h2>6. How long we keep it</h2><p>We keep information only as long as it is needed for its purpose, then delete it. You can ask us to delete it at any time.</p><h2>7. Your rights</h2><p>You can ask what information we hold about you, ask us to correct or delete it, and withdraw your consent. Contact us and we will try to answer quickly.</p><h2>8. Security</h2><p>The admin panel is password-protected and only authorised people can enter. No system is 100% secure, so we cannot guarantee complete security.</p><h2>9. Changes</h2><p>If this policy changes, the new version will be posted on this page with a new date.</p><div class=\"contact\"><h2>Contact us</h2><p>Email: <a href=\"mailto:info.andishmandan6@gmail.com\">info.andishmandan6@gmail.com</a></p><p>Phone and WhatsApp: <a dir=\"ltr\" href=\"tel:+93797821511\" style=\"unicode-bidi:isolate;display:inline-block\">+93797821511</a></p><p>Address: Imam Sahib, Kunduz, Afghanistan</p></div>", "ps": "<h1>د محرمیت تګلاره</h1><p class=\"upd\">وروستی نوي والی: د ۲۰۲۶ کال د اکتوبر ۲۳</p><p class=\"intro\">د اندیشمندان د بهرنیو ژبو زده‌کړې مرکز ستاسو معلوماتو ته درناوی لري. دا پاڼه تشریح کوي چې کوم معلومات راټولوو، ولې، او تاسو کوم حقونه لرئ.</p><h2>۱. کوم معلومات راټولوو</h2><ul><li>د نوم لیکنې فورمه: بشپړ نوم، د اړیکې شمېره، عمر، جنسیت، غوښتل شوی ټولګی او کچه، او اختیاري تشریح.</li><li>د همکارۍ فورمه: نوم، د اړیکې شمېره، بریښنالیک، د همکارۍ ډول، د زده‌کړې کچه، د تدریس سابقه او د انګلیسي ژبې سند.</li><li>د نظرونو فورمه: نوم، کورس، استاد، کچه او د نظر متن.</li><li>د شکایت فورمه: نوم، د اړیکې شمېره، موضوع او د شکایت تفصیل.</li></ul><p>موږ یوازې هغه معلومات غواړو چې د همدې فورمې د ځواب لپاره اړین دي. مهرباني وکړئ حساس معلومات لکه پټنوم یا د پیژندنې اسناد په فورمو کې مه لیکئ.</p><h2>۲. ولې یې کاروو</h2><ul><li>ستاسو سره د اړیکې، د کچې ټاکلو او په مناسب ټولګي کې د ځای ورکولو لپاره (نوم لیکنه).</li><li>د همکارۍ د غوښتنې د بیاکتنې لپاره.</li><li>د شکایت د بیاکتنې او ځواب ورکولو لپاره.</li><li>ستاسو نظر په ویب پاڼه کې د ښودلو لپاره، له بیاکتنې وروسته او یوازې ستاسو په موافقه.</li></ul><p>ستاسو معلومات د اعلان یا نورو ته د پلورلو لپاره نه کاروو.</p><h2>۳. رضایت او عمر</h2><p>د هرې فورمې لاندې د رضایت یو ټیک شته. د هغه په نښه کولو سره تاسو اجازه ورکوئ چې د همدې فورمې معلومات وساتل شي او وکارول شي.</p><p>که تاسو له ۱۸ کلنۍ کم یاست، یوازې د خپل ولي یا سرپرست په اجازه نوم ولیکئ. د نوم لیکنې په فورمه کې له تاسو غواړو دا ټکی تایید کړئ.</p><h2>۴. څوک معلومات لیدلی شي</h2><ul><li>د مرکز کارکوونکي او مدیریت چې د مدیریت پینل ته لاسرسی لري.</li><li>د ویب پاڼې کوربه شرکت چې سرور چلوي. سرور کېدای شي له افغانستان پرته په بل هېواد (لکه امریکا) کې وي.</li></ul><p>موږ ستاسو معلومات هیڅ کس یا شرکت ته نه پلورو، مګر دا چې قانون یې ایجاب کړي.</p><h2>۵. تعقیب او بهرني خدمتونه</h2><p>زموږ ویب پاڼه د احصایې، اعلان یا تعقیب وسایل نلري او د تعقیب کوکي نه ږدي (تفصیل د کوکیو په تګلاره کې دی).</p><p>د ګوګل نقشه د اړیکې په برخه کې ښودل کیږي، نو ستاسو براوزر ګوګل ته نښلي او ګوګل کېدای شي کوکي وساتي.</p><p>د واتساپ، انسټاګرام او فېسبوک لینکونه تاسو نورو ویب پاڼو ته وړي چې خپلې تګلارې لري.</p><p>د امنیت لپاره، سرور د آی‌پي پته او د لیدلو وخت په تخنیکي لاګونو کې ساتي.</p><h2>۶. څومره موده یې ساتو</h2><p>معلومات یوازې تر هغه وخته ساتو چې د همدې هدف لپاره اړین وي، بیا یې پاکوو. تاسو هر وخت کولای شئ د حذف غوښتنه وکړئ.</p><h2>۷. ستاسو حقونه</h2><p>تاسو کولای شئ وپوښتئ چې زموږ سره ستاسو کوم معلومات شته، د سمون یا حذف غوښتنه وکړئ او خپله موافقه بېرته واخلئ. زموږ سره اړیکه ونیسئ؛ هڅه کوو ژر ځواب درکړو.</p><h2>۸. امنیت</h2><p>د مدیریت پینل په پټنوم خوندي دی او یوازې مجاز کسان ورننوځي. هیڅ سیسټم سلنه سلنه خوندي نه دی او موږ بشپړ امنیت تضمین نشو کولای.</p><h2>۹. بدلونونه</h2><p>که دا تګلاره بدله شي، نوې نسخه به په نوې نیټې سره په همدې پاڼه کې ځای پر ځای شي.</p><div class=\"contact\"><h2>زموږ سره اړیکه</h2><p>بریښنالیک: <a href=\"mailto:info.andishmandan6@gmail.com\">info.andishmandan6@gmail.com</a></p><p>تلیفون او واتساپ: <a dir=\"ltr\" href=\"tel:+93797821511\" style=\"unicode-bidi:isolate;display:inline-block\">+93797821511</a></p><p>پته: امام صاحب، کندز، افغانستان</p></div>"}, "skip": {"fa": "پرش به محتوا", "en": "Skip to content", "ps": "منځپانګې ته ورسئ"}, "back": {"fa": "بازگشت به صفحه اصلی", "en": "Back to the home page", "ps": "کور پاڼې ته ستنیدل"}, "btn": {"fa": "EN", "en": "PS", "ps": "دری"}, "aria": {"fa": "تغییر زبان (اکنون دری)", "en": "Change language (now English)", "ps": "ژبه بدله کړئ (اوس پښتو)"}};
const FOOT = {"fa": "<a href=\"privacy.html#%LANG%\">حریم خصوصی</a> <a href=\"terms.html#%LANG%\">شرایط استفاده</a> <a href=\"cookies.html#%LANG%\">سیاست کوکی</a>", "en": "<a href=\"privacy.html#%LANG%\">Privacy Policy</a> <a href=\"terms.html#%LANG%\">Terms of Use</a> <a href=\"cookies.html#%LANG%\">Cookie Policy</a>", "ps": "<a href=\"privacy.html#%LANG%\">د محرمیت تګلاره</a> <a href=\"terms.html#%LANG%\">د کارونې شرایط</a> <a href=\"cookies.html#%LANG%\">د کوکیو تګلاره</a>"};
